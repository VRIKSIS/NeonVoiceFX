
name: Build NeonVoiceFX VST3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract plugin source
        shell: pwsh
        run: |
          Expand-Archive -Path NeonVoiceFX_OnlineBuild_v2.zip -DestinationPath plugin-src

          $cmakeFile = Get-ChildItem plugin-src -Filter CMakeLists.txt -Recurse | Select-Object -First 1

          if (-not $cmakeFile) {
            Get-ChildItem plugin-src -Recurse
            throw "CMakeLists.txt not found in ZIP archive"
          }

          $sourceDir = $cmakeFile.Directory.FullName
          $rootDir = (Resolve-Path plugin-src).Path

          if ($sourceDir -ne $rootDir) {
            Get-ChildItem $sourceDir -Force | Move-Item -Destination $rootDir -Force
          }

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: plugin-src/JUCE

      - name: Configure
        run: cmake -B plugin-src/build -S plugin-src -A x64

      - name: Build VST3
        run: cmake --build plugin-src/build --config Release --target NeonVoiceFX_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NeonVoiceFX-Windows-VST3
          path: plugin-src/build/NeonVoiceFX_artefacts/Release/VST3/**
          if-no-files-found: error
